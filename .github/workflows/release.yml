name: Release (arm64 .app)

# Elle tetiklenir. macOS arm64 runner'da native .app üretir.
# UDE paketi SABİT değildir: build.sh her çalıştığında resmî indirme sayfasından
# (www.uyap.gov.tr/Uyap-Editor) güncel MAC paketini (uyapdokumaneditoru*.zip) bulur.
# Sürüm, indirilen paketin CFBundleVersion'ından türetilir: <ude_surumu>_<N> (ör. 5.4.17_1).
# Böylece UDE yeni sürüm yayınladığında etiket otomatik o sürüme göre oluşur.
# <N> her yeniden yayında otomatik artar (aynı UDE sürümü için).
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Revizyon numarası (boşsa otomatik = mevcut + 1)'
        required: false
      ude_url:
        description: 'UDE paket URL (boşsa resmî indirme sayfasından güncel MAC paketi otomatik bulunur)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64) runner
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_SIGN_P12_B64: ${{ secrets.APPLE_SIGN_P12_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Mimari doğrula (arm64 olmalı)
        run: test "$(uname -m)" = "arm64" || { echo "Runner arm64 değil!"; exit 1; }

      - name: Gömülecek arm64 Java 11 kur (Azul Zulu)
        run: make jdk

      - name: jpackage'lı 17+ JDK hazırla
        run: make jpackage-jdk

      - name: Native arm64 .app üret (modern ikonlarla)
        env:
          UDE_URL: ${{ github.event.inputs.ude_url }}
          ICONS: "1"   # modern Material + Retina ikonlar (scripts/icons/overrides)
        run: make all

      - name: Developer ID imzası uygula
        if: env.APPLE_API_KEY_ID != '' && env.APPLE_SIGN_P12_B64 != ''
        env:
          DEVID_P12_PASSWORD: ${{ secrets.APPLE_SIGN_P12_PASSWORD }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${{ secrets.APPLE_API_KEY_B64 }}" | openssl base64 -d -A -out "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "${{ secrets.APPLE_SIGN_P12_B64 }}" | openssl base64 -d -A -out /tmp/identity.p12
          security create-keychain -p "$DEVID_P12_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$DEVID_P12_PASSWORD" build.keychain
          security import /tmp/identity.p12 -k build.keychain -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$DEVID_P12_PASSWORD" build.keychain
          rm -f /tmp/identity.p12
          make sign-devid

      - name: Uygulamayı notarize et (submit + wait + staple)
        if: env.APPLE_API_KEY_ID != ''
        run: make notarize-app

      - name: Sürümü belirle (<ude_surumu>_<N>)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REV: ${{ github.event.inputs.revision }}
        run: |
          UDE_VER=$(plutil -extract CFBundleVersion raw "build/Uyap Doküman Editörü.app/Contents/Info.plist")
          echo "UDE sürümü: $UDE_VER"
          if [ -n "$INPUT_REV" ]; then
            REV="$INPUT_REV"
          else
            # Mevcut '<UDE_VER>_*' release'lerinden en büyük N'i bulup +1
            LAST=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' 2>/dev/null \
              | grep "^${UDE_VER}_" | sed "s/^${UDE_VER}_//" | sort -n | tail -1)
            REV=$(( ${LAST:-0} + 1 ))
          fi
          TAG="${UDE_VER}_${REV}"
          echo "Yayın etiketi: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build çıktısını doğrula
        run: codesign --verify --verbose "build/Uyap Doküman Editörü.app"

      - name: DMG üret (sürükle-bırak yerleşimli)
        env:
          DMG_OUT: ${{ github.workspace }}/UyapDokumanEditoru-${{ steps.ver.outputs.tag }}-arm64.dmg
        run: |
          brew list create-dmg >/dev/null 2>&1 || brew install create-dmg
          make dmg

      - name: DMG'yi notarize et + staple
        if: env.APPLE_API_KEY_ID != ''
        env:
          DMG_FILE: ${{ github.workspace }}/UyapDokumanEditoru-${{ steps.ver.outputs.tag }}-arm64.dmg
        run: make notarize-dmg

      - name: Sürüm notunu hazırla (sha256 + imza durumu)
        env:
          DMG_FILE: ${{ github.workspace }}/UyapDokumanEditoru-${{ steps.ver.outputs.tag }}-arm64.dmg
          APP_DISPLAY: Uyap Doküman Editörü
        run: |
          SHA=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')
          if [ "$APPLE_API_KEY_ID" ]; then
            IMZANOT="✅ DMG Developer ID imzalı ve Apple notarizasyonundan geçmiştir (stapled). Çift tık normal açılır; xattr gerekmez."
          else
            IMZANOT="⚠️ Bu build ad-hoc imzalıdır (notarize edilmedi — APPLE_API_KEY_ID secret'ı tanımlı değil). İlk açılışta sağ tık → Aç gerekir."
          fi
          cat > release-notes.md <<EOF
          Native Apple Silicon (arm64) build — Rosetta gerektirmez.
          Java gömülü gelir; ayrıca kurulum için bir paket gerekmez. .udf dosyalarına çift tıklayıp açabilirsiniz.

          ## Kurulum
          1. Aşağıdaki .dmg dosyasını indirip çift tıklayın; bir pencere açılır.
          2. Açılan pencerede $APP_DISPLAY simgesini Applications klasörüne sürükleyin.
          3. İlk açılışta Gatekeeper sorgusu çıkarsa sağ tık → Aç ile devam edin.

          ## İmza durumu
          $IMZANOT

          İndirilen dosyanın bütünlüğü için sha256:
          $SHA

          ## Not
          - E-imza için sistemde ayrıca arm64 PKCS#11 token middleware (AKİS vb.) kurulu olmalıdır.
          - ✅ E-imza gerçek kart + arm64 middleware ile test edildi, çalışıyor.
          EOF

      - name: GitHub Release oluştur + dosyayı ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: UyapDokumanEditoru-${{ steps.ver.outputs.tag }}-arm64.dmg
          body_path: release-notes.md
